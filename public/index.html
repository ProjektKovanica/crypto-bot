<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crypto Bot Dashboard</title>
  <style>
    :root{
      --bg:#0f1220;
      --card:#171a2b;
      --muted:#8f9bb3;
      --text:#e8ecf5;
      --ok:#23c552;
      --warn:#f0ad4e;
      --danger:#ff4d4f;
      --line:#262b45;
      --btn:#2a3158;
      --btnh:#384274;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif;
      background:var(--bg);
      color:var(--text);
    }
    .wrap{max-width:1200px;margin:24px auto;padding:0 16px}
    h1{font-size:28px;margin:0 0 16px}
    .muted{color:var(--muted)}
    .grid{
      display:grid;
      grid-template-columns:repeat(12,1fr);
      gap:14px;
    }
    .card{
      grid-column:span 12;
      background:var(--card);
      border:1px solid var(--line);
      border-radius:14px;
      padding:14px;
    }
    .col-4{grid-column:span 4}
    .col-6{grid-column:span 6}
    .col-8{grid-column:span 8}
    .col-12{grid-column:span 12}
    @media(max-width:960px){.col-4,.col-6,.col-8{grid-column:span 12}}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    button{
      background:var(--btn);
      color:var(--text);
      border:1px solid var(--line);
      border-radius:10px;
      padding:10px 14px;
      cursor:pointer;
      font-weight:600;
    }
    button:hover{background:var(--btnh)}
    button.ok{border-color:#1f7a39}
    button.warn{border-color:#8a5b1c}
    button.danger{border-color:#8b2325}
    .pill{
      display:inline-block;
      padding:4px 10px;
      border-radius:999px;
      font-size:12px;
      font-weight:700;
      border:1px solid var(--line);
    }
    .pill.ok{color:#b9ffd0;border-color:#245f37;background:#14301f}
    .pill.stop{color:#ffd2d2;border-color:#6e2a2b;background:#321718}
    .kpi{font-size:26px;font-weight:800}
    .small{font-size:13px}
    table{
      width:100%;
      border-collapse:collapse;
      font-size:14px;
    }
    th,td{
      text-align:left;
      padding:10px 8px;
      border-bottom:1px solid var(--line);
      vertical-align:top;
    }
    th{color:#b8c1d9;font-weight:700}
    input,select,textarea{
      width:100%;
      background:#101427;
      border:1px solid var(--line);
      color:var(--text);
      border-radius:10px;
      padding:9px 10px;
    }
    .right{margin-left:auto}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .statusline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .hr{height:1px;background:var(--line);margin:10px 0}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>🤖 Crypto Bot Dashboard</h1>
    <div class="muted small">Secure API mode (x-api-key)</div>

    <div class="grid" style="margin-top:14px">
      <div class="card col-12">
        <div class="row">
          <div class="statusline">
            <span id="botPill" class="pill">Loading...</span>
            <span class="small muted">Cycle:</span> <span id="cycleCounter" class="mono">-</span>
            <span class="small muted">Running:</span> <span id="cycleRunning" class="mono">-</span>
            <span class="small muted">Last Start:</span> <span id="lastStart" class="mono">-</span>
            <span class="small muted">Last End:</span> <span id="lastEnd" class="mono">-</span>
          </div>
          <button class="right" onclick="changeApiKey()">Change API Key</button>
        </div>
      </div>

      <div class="card col-4">
        <div class="muted small">USDC Free</div>
        <div id="kpiFree" class="kpi">$0.00</div>
      </div>
      <div class="card col-4">
        <div class="muted small">USDC Used</div>
        <div id="kpiUsed" class="kpi">$0.00</div>
      </div>
      <div class="card col-4">
        <div class="muted small">USDC Total</div>
        <div id="kpiTotal" class="kpi">$0.00</div>
      </div>

      <div class="card col-12">
        <div class="row">
          <button class="warn" onclick="pauseBot()">⏸ Pause (no new entries)</button>
          <button class="ok" onclick="resumeBot()">▶ Resume</button>
          <button class="danger" onclick="emergencyStop()">🛑 Emergency Stop</button>
          <button onclick="refreshAll()">🔄 Refresh</button>
        </div>
      </div>

      <div class="card col-12">
        <h3 style="margin-top:0">Active Positions</h3>
        <table id="positionsTable">
          <thead>
            <tr>
              <th>Symbol</th>
              <th>Side</th>
              <th>Entry</th>
              <th>Size</th>
              <th>SL</th>
              <th>TP</th>
              <th>Open Time</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="positionsBody"></tbody>
        </table>
      </div>

      <div class="card col-12">
        <h3 style="margin-top:0">Settings</h3>
        <div class="grid">
          <div class="col-4">
            <label class="small muted">RISK_PERCENT</label>
            <input id="RISK_PERCENT" />
          </div>
          <div class="col-4">
            <label class="small muted">MAX_LEVERAGE</label>
            <input id="MAX_LEVERAGE" />
          </div>
          <div class="col-4">
            <label class="small muted">LIQUIDATION_SAFETY_FACTOR</label>
            <input id="LIQUIDATION_SAFETY_FACTOR" />
          </div>
          <div class="col-4">
            <label class="small muted">MAX_CONCURRENT_POSITIONS</label>
            <input id="MAX_CONCURRENT_POSITIONS" />
          </div>
          <div class="col-4">
            <label class="small muted">COOLDOWN_SECONDS</label>
            <input id="COOLDOWN_SECONDS" />
          </div>
          <div class="col-4">
            <label class="small muted">TRADING_HOURS</label>
            <input id="TRADING_HOURS" />
          </div>
          <div class="col-4">
            <label class="small muted">MAX_DAILY_LOSS_PERCENT</label>
            <input id="MAX_DAILY_LOSS_PERCENT" />
          </div>
        </div>
        <div class="row" style="margin-top:12px">
          <button class="ok" onclick="saveSettings()">💾 Save Settings</button>
          <span id="settingsMsg" class="small muted"></span>
        </div>
      </div>

      <div class="card col-12">
        <h3 style="margin-top:0">Recent Trades</h3>
        <table>
          <thead>
            <tr>
              <th>Time</th>
              <th>Symbol</th>
              <th>Side</th>
              <th>Price</th>
              <th>Amount</th>
              <th>PnL</th>
            </tr>
          </thead>
          <tbody id="tradesBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // ---------- API KEY ----------
    let API_KEY = localStorage.getItem('apiKey') || '';
    if (!API_KEY) {
      API_KEY = prompt('Enter API key');
      if (API_KEY) localStorage.setItem('apiKey', API_KEY);
    }

    function changeApiKey() {
      const k = prompt('Enter new API key');
      if (k !== null) {
        API_KEY = k.trim();
        localStorage.setItem('apiKey', API_KEY);
        refreshAll();
      }
    }

    async function apiFetch(url, options = {}) {
      const headers = {
        'Content-Type': 'application/json',
        'x-api-key': API_KEY || '',
        ...(options.headers || {})
      };
      const res = await fetch(url, { ...options, headers });
      if (!res.ok) {
        let msg = `HTTP ${res.status}`;
        try {
          const j = await res.json();
          if (j?.error) msg += ` - ${j.error}`;
        } catch (_) {}
        throw new Error(msg);
      }
      const ct = res.headers.get('content-type') || '';
      if (ct.includes('application/json')) return res.json();
      return res.text();
    }

    function fmt(v, d = 2) {
      const n = Number(v || 0);
      return n.toLocaleString(undefined, { minimumFractionDigits: d, maximumFractionDigits: d });
    }

    function setStatusPill(status) {
      const el = document.getElementById('botPill');
      if (status === 'RUNNING') {
        el.className = 'pill ok';
        el.textContent = 'RUNNING';
      } else {
        el.className = 'pill stop';
        el.textContent = 'STOPPED';
      }
    }

    // ---------- LOADERS ----------
    async function loadStatus() {
      const s = await apiFetch('/api/status');
      setStatusPill(s.status);
      document.getElementById('cycleCounter').textContent = s.cycleCounter ?? '-';
      document.getElementById('cycleRunning').textContent = s.isCycleRunning ? 'YES' : 'NO';
      document.getElementById('lastStart').textContent = s.lastCycleStartedAt || '-';
      document.getElementById('lastEnd').textContent = s.lastCycleEndedAt || '-';
    }

    async function loadBalance() {
      const b = await apiFetch('/api/balance');
      document.getElementById('kpiFree').textContent = `$${fmt(b.free)}`;
      document.getElementById('kpiUsed').textContent = `$${fmt(b.used)}`;
      document.getElementById('kpiTotal').textContent = `$${fmt(b.total)}`;
    }

    async function loadPositions() {
      const rows = await apiFetch('/api/positions');
      const tb = document.getElementById('positionsBody');
      tb.innerHTML = '';
      if (!rows.length) {
        tb.innerHTML = `<tr><td colspan="8" class="muted">No active positions.</td></tr>`;
        return;
      }

      for (const p of rows) {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="mono">${p.symbol || ''}</td>
          <td>${p.side || ''}</td>
          <td>${fmt(p.entry_price, 6)}</td>
          <td>${fmt(p.size, 6)}</td>
          <td>${p.stop_loss == null ? '-' : fmt(p.stop_loss, 6)}</td>
          <td>${p.take_profit == null ? '-' : fmt(p.take_profit, 6)}</td>
          <td>${p.open_time || '-'}</td>
          <td>
            <div class="row">
              <button onclick="moveBE('${(p.symbol||'').replace(/'/g, "\\'")}')">SL→BE</button>
              <button class="danger" onclick="closePos('${(p.symbol||'').replace(/'/g, "\\'")}')">Close</button>
            </div>
          </td>
        `;
        tb.appendChild(tr);
      }
    }

    async function loadSettings() {
      const s = await apiFetch('/api/settings');
      const keys = [
        'RISK_PERCENT',
        'MAX_LEVERAGE',
        'LIQUIDATION_SAFETY_FACTOR',
        'MAX_CONCURRENT_POSITIONS',
        'COOLDOWN_SECONDS',
        'TRADING_HOURS',
        'MAX_DAILY_LOSS_PERCENT'
      ];
      for (const k of keys) {
        const el = document.getElementById(k);
        if (el) el.value = s[k] ?? '';
      }
    }

    async function loadTrades() {
      const rows = await apiFetch('/api/trades?limit=20');
      const tb = document.getElementById('tradesBody');
      tb.innerHTML = '';
      if (!rows.length) {
        tb.innerHTML = `<tr><td colspan="6" class="muted">No trades yet.</td></tr>`;
        return;
      }
      for (const t of rows) {
        const pnl = Number(t.realized_pnl || 0);
        const color = pnl >= 0 ? 'style="color:#8ff5b1"' : 'style="color:#ff9f9f"';
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${t.timestamp || '-'}</td>
          <td class="mono">${t.symbol || ''}</td>
          <td>${t.side || ''}</td>
          <td>${fmt(t.price, 6)}</td>
          <td>${fmt(t.amount, 6)}</td>
          <td ${color}>${fmt(pnl, 2)}</td>
        `;
        tb.appendChild(tr);
      }
    }

    // ---------- ACTIONS ----------
    async function pauseBot() {
      if (!confirm('Pause bot? (no new entries)')) return;
      await apiFetch('/api/pause', { method: 'POST' });
      await refreshAll();
    }

    async function resumeBot() {
      await apiFetch('/api/resume', { method: 'POST' });
      await refreshAll();
    }

    async function emergencyStop() {
      if (!confirm('Emergency stop will set BOT_ACTIVE=false and close all positions. Continue?')) return;
      await apiFetch('/api/emergency-stop', { method: 'POST' });
      await refreshAll();
    }

    async function closePos(symbol) {
      if (!confirm(`Close position ${symbol}?`)) return;
      await apiFetch('/api/close-position', {
        method: 'POST',
        body: JSON.stringify({ symbol })
      });
      await refreshAll();
    }

    async function moveBE(symbol) {
      await apiFetch('/api/move-sl-breakeven', {
        method: 'POST',
        body: JSON.stringify({ symbol })
      });
      await refreshAll();
    }

    async function saveSettings() {
      const payload = {
        RISK_PERCENT: document.getElementById('RISK_PERCENT').value,
        MAX_LEVERAGE: document.getElementById('MAX_LEVERAGE').value,
        LIQUIDATION_SAFETY_FACTOR: document.getElementById('LIQUIDATION_SAFETY_FACTOR').value,
        MAX_CONCURRENT_POSITIONS: document.getElementById('MAX_CONCURRENT_POSITIONS').value,
        COOLDOWN_SECONDS: document.getElementById('COOLDOWN_SECONDS').value,
        TRADING_HOURS: document.getElementById('TRADING_HOURS').value,
        MAX_DAILY_LOSS_PERCENT: document.getElementById('MAX_DAILY_LOSS_PERCENT').value
      };
      await apiFetch('/api/settings', {
        method: 'POST',
        body: JSON.stringify(payload)
      });
      const el = document.getElementById('settingsMsg');
      el.textContent = 'Saved.';
      setTimeout(() => el.textContent = '', 2000);
    }

    async function refreshAll() {
      try {
        await Promise.all([
          loadStatus(),
          loadBalance(),
          loadPositions(),
          loadSettings(),
          loadTrades()
        ]);
      } catch (e) {
        alert('Dashboard error: ' + e.message + '\nTip: check API key via "Change API Key".');
      }
    }

    // initial load + auto-refresh
    refreshAll();
    setInterval(() => {
      loadStatus().catch(() => {});
      loadBalance().catch(() => {});
      loadPositions().catch(() => {});
    }, 15000);
  </script>
</body>
</html>
